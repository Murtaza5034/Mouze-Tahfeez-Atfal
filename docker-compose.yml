# ============================================
# Docker Compose for Mauze Tahfeez
# Web Portal + 24/7 Persistent WhatsApp Bot Service
# ============================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mauze-tahfeez-web
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: mauze-whatsapp-bot
    ports:
      - "2785:2785"
    volumes:
      - ./baileys_auth_info:/app/baileys_auth_info
    restart: always
    environment:
      - PORT=2785
      - NODE_ENV=production
